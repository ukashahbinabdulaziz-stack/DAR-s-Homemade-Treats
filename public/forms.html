<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Netlify Forms Bot Helper</title>
</head>
<body>
    <form name="order-form" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="text" name="name" />
        <input type="text" name="phone" />
        <textarea name="message"></textarea>
    </form>
</body>
</html>
